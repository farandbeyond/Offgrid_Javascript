<html>
    <head>
        <link rel="stylesheet" href="main.css">
    </head>
    <body>
        <main>
            <div id="controls" class="controls flex-box">
                <div class="linkedControl">
                    <input type="text" id="width" class="sizeInput width" inputmode="[0-9]+"></input>
                    <input type="text"  id="height" class="sizeInput height" pattern="[0-9]+"></input>
                    <!-- <button id="newMap">Generate New Map</button> -->
                     <input type="submit" id="newMap" value="Generate New Map">
                </div>
                <div class="linkedControl">
                    <textarea id="mapString"></textarea>
                    <div class="inline">
                        <button id="loadMap">Load from String</button>
                        <button id="saveMap">Save to String</button>
                    </div>
                </div>
            </div>
            <div class="flex-box">
                <canvas id="mainCanvas" class="mainCanvas"></canvas>
                <div class="palette">
                    <p>Border Tile: </p>
                    <select name="Border_Tile" class="image-select" id="borderTile">
                        <button>
                            <selectedcontent></selectedcontent>
                        </button>
                    </select>

                    <div id="tilePalette"></div>
                </div>
            </div>
            
        </main>
    </body>
    <footer>
        <script src="tile.js" defer></script>
        <script src="offgrid.js" defer></script>
    </footer>
</html>
