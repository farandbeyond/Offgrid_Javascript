<html>
    <head>
        <link rel="stylesheet" href="main.css">
    </head>
    <body>
        <main>
            <div id="controls" class="controls">
                <input type="text" id="width" class="width" pattern="[0-9]"></input>
                <input type="text"  id="height" class="height" pattern="[0-9]"></input>
                <button id="newMap">Generate New Map</button>
                <textarea id="mapString"></textarea>
                <button id="loadMap">Load from String</button>
                <button id="saveMap">Save to String</button>
            </div>
            <canvas id="mainCanvas" class="mainCanvas"></canvas>
            <div id="palette" class="palette"></div>
        </main>
    </body>
    <footer>
        <script src="tile.js" defer></script>
        <script src="offgrid.js" defer></script>
    </footer>
</html>
